[project]
name = "camp-project"
version = "0.1.0"
description = "Project on two-state Markov chain simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "jupyterlab>=4.5.7",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camp_project"]